name: Build ImmortalWrt for XR1710G (Bridge Offload)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'configs/**'
      - 'diy-part2.d/**'
      - 'packages/**'
      - 'apps/**'
      - 'files/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Setup build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y $(cat depends/ubuntu-22.04 | tr '\n' ' ')
          echo "=== Build tools OK ==="

      - name: Checkout YYH2913 OpenWrt source
        run: |
          git clone --depth=1 -b xr1710g-6.18 \
            https://github.com/YYH2913/openwrt.git /workdir
          echo "SOURCE_DIR=/workdir" >> $GITHUB_ENV

      - name: Apply YYH2913 XR1710G DTS and patches
        working-directory: /workdir
        run: |
          YYH_RAW="https://raw.githubusercontent.com/YYH2913/openwrt/xr1710g-6.18-integration/target/linux/airoha"
          # DTS
          curl -sSL -o target/linux/airoha/dts/an7581-xr1710g-ubi.dts \
            $YYH_RAW/dts/an7581-xr1710g-ubi.dts
          echo "✅ XR1710G DTS applied"

      - name: Apply Bridge Offload patches
        working-directory: /workdir
        run: |
          set -ex
          PATCH_DIR="target/linux/airoha/patches-6.18"
          GENERIC_PATCH_DIR="target/linux/generic/pending-6.18"

          # Replace YYH2913's 675-04 (VLAN passthrough) with bridge flowtable type
          rm -f $PATCH_DIR/675-04-*.patch
          rm -f $GENERIC_PATCH_DIR/675-04-*.patch
          cp ${{ github.workspace }}/patches/675-04-netfilter-nf_flow_table-add-bridge-flowtable-type.patch \
             $GENERIC_PATCH_DIR/
          echo "✅ 675-04 bridge flowtable type applied"

          # Add 675-05 (bridge conntrack double VLAN PPPoE)
          cp ${{ github.workspace }}/patches/675-05-netfilter-bridge-Add-conntrack-double-vlan-pppoe.patch \
             $GENERIC_PATCH_DIR/
          echo "✅ 675-05 bridge conntrack applied"

          # Enable bridge flowtable kernel module
          echo "CONFIG_NF_FLOW_TABLE_BRIDGE=m" >> target/linux/airoha/an7581/config-6.18
          echo "✅ CONFIG_NF_FLOW_TABLE_BRIDGE=m written"

      - name: Setup feeds
        working-directory: /workdir
        run: |
          # Add custom feeds
          cat ${{ github.workspace }}/feeds.d/immortalwrt >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply DIY customizations
        working-directory: /workdir
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          bash ${{ github.workspace }}/scripts/diy-part1.sh
          bash ${{ github.workspace }}/diy-part2.d/immortalwrt.sh

      - name: Load config and defconfig
        working-directory: /workdir
        run: |
          cp ${{ github.workspace }}/configs/immortalwrt.config .config
          make defconfig

      - name: Download packages
        working-directory: /workdir
        run: make download -j$(nproc)

      - name: Compile firmware
        working-directory: /workdir
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "=== Build complete ==="

      - name: Collect artifacts
        working-directory: /workdir
        run: |
          mkdir -p ${{ github.workspace }}/release
          find bin/targets/airoha/an7581 -name "*.itb" -exec cp {} ${{ github.workspace }}/release/ \;
          find bin/targets/airoha/an7581 -name "sha256sums" -exec cp {} ${{ github.workspace }}/release/ \;
          cp .config ${{ github.workspace }}/release/config.buildinfo
          ls -la ${{ github.workspace }}/release/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: XR1710G-ImmortalWrt-bridge-offload
          path: release/
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
