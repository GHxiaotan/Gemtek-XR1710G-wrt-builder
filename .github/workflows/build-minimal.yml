name: Build XR1710G (Minimal Bridge Offload)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            dos2unix fastjar flex g++ g++-multilib gawk gcc-multilib gettext git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libreadline-dev libssl-dev libtool lrzsz mkisofs ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-distutils python3-pyelftools libpython3-dev \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev file

      - name: Clone YYH2913 source (xr1710g-6.18)
        run: |
          git clone --depth=1 -b xr1710g-6.18 \
            https://github.com/YYH2913/openwrt.git $GITHUB_WORKSPACE/openwrt

      - name: Apply Bridge Offload patches
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -ex
          GENERIC_PATCH="target/linux/generic/pending-6.18"

          # 1. Replace 675-04 (VLAN passthrough → bridge flowtable type)
          rm -f $GENERIC_PATCH/675-04-*.patch
          cp ${{ github.workspace }}/builder/patches/675-04-netfilter-nf_flow_table-add-bridge-flowtable-type.patch \
             $GENERIC_PATCH/
          echo "✅ 675-04 bridge flowtable type"

          # 2. Add 675-05 (bridge conntrack VLAN PPPoE)
          cp ${{ github.workspace }}/builder/patches/675-05-netfilter-bridge-Add-conntrack-double-vlan-pppoe.patch \
             $GENERIC_PATCH/
          echo "✅ 675-05 bridge conntrack"

          # 3. Enable kernel module IN THE TARGET CONFIG (before defconfig!)
          echo "CONFIG_NF_FLOW_TABLE_BRIDGE=m" >> target/linux/airoha/an7581/config-6.18
          echo "✅ kernel config"

      - name: Build firmware
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          export FORCE_UNSAFE_CONFIGURE=1

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Generate .config for airoha/an7581 target
          make defconfig

          # Force NF_FLOW_TABLE_BRIDGE=m (in case defconfig didn't pick it up)
          sed -i '/CONFIG_NF_FLOW_TABLE_BRIDGE/d' .config
          echo "CONFIG_NF_FLOW_TABLE_BRIDGE=m" >> .config

          # Re-sync config (answer Y to new options automatically)
          yes "" 2>/dev/null | make oldconfig || true

          # Verify the option is set
          grep "NF_FLOW_TABLE_BRIDGE" .config || echo "WARNING: NF_FLOW_TABLE_BRIDGE not found in .config"

          # Verify correct target
          grep "CONFIG_TARGET_airoha_an7581" .config

          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          mkdir -p ${{ github.workspace }}/release
          find bin/targets -name "*.itb" -exec cp {} ${{ github.workspace }}/release/ \;
          find bin/targets -name "sha256sums" -exec cp {} ${{ github.workspace }}/release/ \;
          cp .config ${{ github.workspace }}/release/config.buildinfo
          ls -lh ${{ github.workspace }}/release/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: XR1710G-bridge-offload-minimal
          path: release/
          retention-days: 90
