name: Build XR1710G (Minimal Bridge Offload)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            dos2unix fastjar flex g++ g++-multilib gawk gcc-multilib gettext git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libreadline-dev libssl-dev libtool lrzsz mkisofs ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-distutils python3-pyelftools libpython3-dev \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev file

      - name: Clone YYH2913 source (xr1710g-6.18)
        run: |
          git clone --depth=1 -b xr1710g-6.18 \
            https://github.com/YYH2913/openwrt.git /workdir

      - name: Apply only Bridge Offload patches
        working-directory: /workdir
        run: |
          set -ex
          GENERIC_PATCH="target/linux/generic/pending-6.18"

          # 1. Replace 675-04 (VLAN passthrough → bridge flowtable type)
          rm -f $GENERIC_PATCH/675-04-*.patch
          cp /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/builder/patches/675-04-netfilter-nf_flow_table-add-bridge-flowtable-type.patch \
             $GENERIC_PATCH/
          echo "✅ 675-04 bridge flowtable type"

          # 2. Add 675-05 (bridge conntrack VLAN PPPoE)
          cp /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/builder/patches/675-05-netfilter-bridge-Add-conntrack-double-vlan-pppoe.patch \
             $GENERIC_PATCH/
          echo "✅ 675-05 bridge conntrack"

          # 3. Enable kernel module
          echo "CONFIG_NF_FLOW_TABLE_BRIDGE=m" >> target/linux/airoha/an7581/config-6.18
          echo "✅ kernel config"

      - name: Build firmware
        working-directory: /workdir
        run: |
          export FORCE_UNSAFE_CONFIGURE=1
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Minimal config: default + bridge offload module
          make defconfig
          echo "CONFIG_NF_FLOW_TABLE_BRIDGE=m" >> .config
          make defconfig

          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        working-directory: /workdir
        run: |
          mkdir -p /tmp/release
          find bin/targets/airoha/an7581 -name "*.itb" -exec cp {} /tmp/release/ \;
          find bin/targets/airoha/an7581 -name "sha256sums" -exec cp {} /tmp/release/ \;
          cp .config /tmp/release/config.buildinfo
          ls -lh /tmp/release/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: XR1710G-bridge-offload-minimal
          path: /tmp/release/
          retention-days: 90
